kind = "web"
previewPath = "/"
title = "AI Trade Analysis Platform"
version = "1.0.0"
id = "artifacts/trade-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24463

[services.development]
run = "pnpm --filter @workspace/trade-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trade-platform", "run", "build" ]
publicDir = "artifacts/trade-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24463"
BASE_PATH = "/"
